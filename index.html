<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@Lqtaty</title>
    <!-- استدعاء خط Montserrat الشيك والعصري -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #1b4d2e; /* لون الخلفية الأخضر المطابق للصورة تماماً */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            text-align: center;
        }
        
        /* حاوية المحتوى في النص بمسافات متساوية */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 40px 20px 20px 20px;
        }
        
        /* دائرة اللوجو الأساسية */
        .profile-pic-container {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .profile-pic-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* اسم البراند: @Lqtaty بالخط الشيك والعلامة على الشمال تماماً */
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 16px 0;
            letter-spacing: 0.5px;
            direction: ltr;
            unicode-bidi: bidi-override;
            text-align: center;
            width: 100%;
        }

        /* الوصف مقسم لسطرين بالظبط وفي المنتصف تماماً */
        p.bio {
            font-size: 13.5px;
            line-height: 1.8;
            margin: 0 0 30px 0;
            padding: 0 5px;
            max-width: 460px;
            font-weight: 400;
            text-align: center;
        }
        
        /* حاوية الأيقونات: مسافات متقاربة ومريحة للعين وموزعة بانتظام تامة */
        .social-icons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 160px; /* مسافات مظبوطة ومريحة جداً */
            margin-bottom: 20px;
            direction: ltr; 
        }
        
        .social-icons a {
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        
        .social-icons a:hover {
            transform: scale(1.1);
        }

        /* أيقونات الـ SVG (تيك توك وإكس) */
        .social-icons svg {
            width: 32px;
            height: 32px;
            fill: #ffffff;
        }

        /* ستايل صورة سناب شات: الحجم 39px مع عزل الخلفية السوداء تماماً */
        .snapchat-img {
            width: 39px;
            height: 39px;
            object-fit: contain;
            mix-blend-mode: screen; /* إخفاء الخلفية السوداء وإظهار الأبيض الناصع فقط */
        }
    </style>
</head>
<body>

    <div class="content">
        <!-- صورة اللوجو الرئيسي -->
        <div class="profile-pic-container">
            <img src="images/logo.webp" alt="Lqtaty Logo">
        </div>

        <!-- اسم البراند -->
        <h1>@Lqtaty</h1>

        <!-- الوصف مقسم لسطرين بالظبط -->
        <p class="bio">
            أقوي عروض و أكواد خصم علي نون و شي إن في السعودية،<br>
            تابعنا علي باقي المنصات عشان تشوف كل جديد بي استمرار
        </p>

        <!-- أيقونات التواصل الاجتماعي الثلاثة بالروابط المدمجة -->
        <div class="social-icons">
            
            <!-- 1. Snapchat -->
            <a href="https://snapchat.com/t/4Q07ZWMR" target="_blank" aria-label="Snapchat">
                <img src="images/Snapchat.webp" alt="Snapchat" class="snapchat-img">
            </a>

            <!-- 2. TikTok -->
            <a href="https://www.tiktok.com/@lqtatyy?_r=1&_t=ZS-99nMe7VkpAw" target="_blank" aria-label="TikTok">
                <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
            </a>

            <!-- 3. X -->
            <a href="https://x.com/lqtaty?s=11" target="_blank" aria-label="X">
                <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            </a>

        </div>
    </div>

</body>
</html>
