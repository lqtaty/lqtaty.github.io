<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@lqtaty</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1b4d2e; /* لون الخلفية الأخضر المطابق للصورة تماماً */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* رفع المحتوى للأعلى لتجنب الزحمة */
            min-height: 100vh;
            text-align: center;
        }
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            padding: 40px 20px 20px 20px;
        }
        /* دائرة الصورة الدائرية البيضاء */
        .profile-pic-container {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .profile-pic-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* اسم البراند (lqtaty@) */
        h1 {
            font-family: 'Comfortaa', 'Quicksand', 'Segoe UI', Tahoma, sans-serif;
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 16px 0;
            letter-spacing: 0.5px;
            direction: ltr;
        }

        /* الوصف */
        p.bio {
            font-size: 15px;
            line-height: 1.7;
            margin: 0 0 30px 0;
            padding: 0 10px;
            max-width: 450px;
            font-weight: 400;
            text-align: center;
        }
        
        /* حاوية الأيقونات: متمسكة باتجاه ltr عشان تفضل بنفس ترتيب Linktree الدقيق */
        .social-icons {
            display: flex;
            gap: 28px;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            direction: ltr; 
        }
        .social-icons a {
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .social-icons a:hover {
            transform: scale(1.1);
        }
        .social-icons svg {
            width: 32px;
            height: 32px;
            fill: #ffffff; /* أبيض نقي تماماً */
        }
    </style>
</head>
<body>

    <div class="content">
        <!-- دائرة الصورة -->
        <div class="profile-pic-container">
            <img src="images/logo.webp" alt="Lqtaty Logo">
        </div>

        <!-- اسم البراند -->
        <h1>lqtaty@</h1>

        <!-- الوصف -->
        <p class="bio">أقوي عروض و أكواد خصم علي نون و شي إن في السعودية، تابعنا علي باقي المنصات عشان تشوف كل جديد بي استمرار</p>

        <!-- أيقونات منصات التواصل الاجتماعي (مرتبة بالترتيب الصحيح: سناب شات، تيك توك، إكس) -->
        <div class="social-icons">
            <!-- 1. Snapchat -->
            <a href="حط_رابط_السناب" target="_blank" aria-label="Snapchat">
                <svg viewBox="0 0 24 24"><path d="M12.015 2c-3.11 0-7.015 2.13-7.015 6.27 0 2.22.99 3.73 2.1 4.71.36.32.55.77.49 1.25-.13 1.07-.63 2.54-1.63 3.69-.14.16-.1.39.08.49.11.06.23.08.35.05 1.5-.39 3.03-1.46 3.96-2.31.34-.31.83-.34 1.2-.08.73.51 1.71.86 2.54.86.83 0 1.81-.35 2.54-.86.37-.26.86-.23 1.2.08.93.85 2.46 1.92 3.96 2.31.12.03.24.01.35-.05.18-.1.22-.33.08-.49-1-1.15-1.5-2.62-1.63-3.69-.06-.48.13-.93.49-1.25 1.11-.98 2.1-2.49 2.1-4.71 0-4.14-3.905-6.27-7.015-6.27z"/></svg>
            </a>
            <!-- 2. TikTok -->
            <a href="حط_رابط_التيكتوك" target="_blank" aria-label="TikTok">
                <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
            </a>
            <!-- 3. X (Twitter) -->
            <a href="حط_رابط_إكس" target="_blank" aria-label="X">
                <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            </a>
        </div>
    </div>

</body>
</html>
