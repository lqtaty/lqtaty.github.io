<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@Lqtaty</title>
    <!-- استدعاء خط Montserrat الشيك والعصري -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #1b4d2e; /* لون الخلفية الأخضر المطابق للصورة تماماً */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            text-align: center;
        }
        
        /* حاوية المحتوى في النص بمسافات متساوية */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 40px 20px 40px 20px;
        }
        
        /* دائرة اللوجو الأساسية */
        .profile-pic-container {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .profile-pic-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* اسم البراند: @Lqtaty بالخط الشيك والعلامة على الشمال تماماً */
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 24px 0; /* زيادة المسافة الفارغة أسفل الاسم بوضوح لراحة العين */
            letter-spacing: 0.5px;
            direction: ltr;
            unicode-bidi: bidi-override;
            text-align: center;
            width: 100%;
        }

        /* الوصف مقسم لسطرين بالظبط وفي المنتصف تماماً */
        p.bio {
            font-size: 13.5px;
            line-height: 1.8;
            margin: 0 0 30px 0;
            padding: 0 5px;
            max-width: 460px;
            font-weight: 400;
            text-align: center;
        }
        
        /* حاوية الأيقونات */
        .social-icons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 160px;
            margin-bottom: 35px;
            direction: ltr; 
        }
        
        .social-icons a {
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        
        .social-icons a:hover {
            transform: scale(1.1);
        }

        /* أيقونات الـ SVG (تيك توك) */
        .social-icons svg {
            width: 32px;
            height: 32px;
            fill: #ffffff;
        }

        /* تخصيص أيقونة إكس 31px */
        .x-icon {
            width: 31px !important;
            height: 31px !important;
        }

        /* ستايل صورة سناب شات 39px مع عزل الخلفية السوداء */
        .snapchat-img {
            width: 39px;
            height: 39px;
            object-fit: contain;
            mix-blend-mode: screen;
        }

        /* --- تصميم قوائم المتاجر --- */
        .stores-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .store-dropdown {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            overflow: hidden;
            transition: background-color 0.3s;
        }

        .store-header {
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            user-select: none;
        }

        .store-header:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        /* السهم الخاص بالقائمة */
        .arrow {
            transition: transform 0.3s ease;
            font-size: 14px;
        }

        /* الخيارات السفلية (مخفية افتراضياً وتظهر عند الضغط) */
        .store-options {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease-out;
            background-color: rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
        }

        .store-options a {
            padding: 12px 20px;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            transition: background-color 0.2s;
            text-align: right;
        }

        .store-options a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* كلاس تفعيل القائمة */
        .store-dropdown.active .store-options {
            max-height: 200px;
        }

        .store-dropdown.active .arrow {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>

    <div class="content">
        <!-- صورة اللوجو الرئيسي -->
        <div class="profile-pic-container">
            <img src="images/logo.webp" alt="Lqtaty Logo">
        </div>

        <!-- اسم البراند -->
        <h1>@Lqtaty</h1>

        <!-- الوصف مقسم لسطرين بالظبط -->
        <p class="bio">
            أقوي عروض و أكواد خصم علي نون و شي إن في السعودية،<br>
            تابعنا علي باقي المنصات عشان تشوف كل جديد بي استمرار
        </p>

        <!-- أيقونات التواصل الاجتماعي الثلاثة بالروابط المدمجة -->
        <div class="social-icons">
            
            <!-- 1. Snapchat -->
            <a href="https://snapchat.com/t/4Q07ZWMR" target="_blank" aria-label="Snapchat">
                <img src="images/Snapchat.webp" alt="Snapchat" class="snapchat-img">
            </a>

            <!-- 2. TikTok -->
            <a href="https://www.tiktok.com/@lqtatyy?_r=1&_t=ZS-99nMe7VkpAw" target="_blank" aria-label="TikTok">
                <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
            </a>

            <!-- 3. X -->
            <a href="https://x.com/lqtaty?s=11" target="_blank" aria-label="X">
                <svg class="x-icon" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            </a>

        </div>

        <!-- قايمتين المتاجر -->
        <div class="stores-container">
            
            <!-- متجر نون - noon -->
            <div class="store-dropdown" id="noonDropdown">
                <div class="store-header" onclick="toggleStore('noonDropdown')">
                    <span>متجر نون - noon</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="store-options">
                    <a href="#">الخيار الأول (فارغ)</a>
                    <a href="#">الخيار الثاني (فارغ)</a>
                    <a href="#">الخيار الثالث (فارغ)</a>
                </div>
            </div>

            <!-- متجر شي إن - SHEIN -->
            <div class="store-dropdown" id="sheinDropdown">
                <div class="store-header" onclick="toggleStore('sheinDropdown')">
                    <span>متجر شي إن - SHEIN</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="store-options">
                    <a href="#">الخيار الأول (فارغ)</a>
                    <a href="#">الخيار الثاني (فارغ)</a>
                    <a href="#">الخيار الثالث (فارغ)</a>
                </div>
            </div>

        </div>
    </div>

    <!-- كود JavaScript للقوائم المنسدلة -->
    <script>
        function toggleStore(dropdownId) {
            const dropdown = document.getElementById(dropdownId);
            document.querySelectorAll('.store-dropdown').forEach(item => {
                if (item.id !== dropdownId) {
                    item.classList.remove('active');
                }
            });
            dropdown.classList.toggle('active');
        }
    </script>

</body>
</html>
